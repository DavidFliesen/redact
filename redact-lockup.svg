<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Redact — take your data back">
  <defs>
    <clipPath id="cardL"><rect x="12" y="28" width="144" height="144" rx="34"/></clipPath>
  </defs>

  <!-- ===== mark ===== -->
  <rect x="12" y="28" width="144" height="144" rx="34" fill="#E7E4DB"/>
  <g clip-path="url(#cardL)" stroke="#17150F" stroke-opacity="0.07" stroke-width="2">
    <line x1="12" y1="66" x2="156" y2="66"/>
    <line x1="12" y1="100" x2="156" y2="100"/>
    <line x1="12" y1="134" x2="156" y2="134"/>
  </g>
  <g fill="#17150F" fill-opacity="0.28">
    <rect x="34" y="72" width="14" height="9" rx="2"/>
    <rect x="34" y="106" width="14" height="9" rx="2"/>
    <rect x="34" y="140" width="14" height="9" rx="2"/>
  </g>
  <rect x="58" y="66"  width="70"  height="22" rx="5" fill="#14120B"/>
  <rect x="58" y="100" width="86"  height="22" rx="5" fill="#14120B"/>
  <rect x="58" y="134" width="46"  height="22" rx="5" fill="#C6902A"/>

  <!-- ===== wordmark: REDACT knocked out of a redaction bar ===== -->
  <rect x="196" y="62" width="470" height="76" rx="10" fill="#14120B"/>
  <text x="222" y="118"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
        font-size="62" font-weight="700" letter-spacing="6" fill="#E7E4DB">REDACT</text>
  <!-- amber brand tick -->
  <rect x="676" y="62" width="20" height="76" rx="6" fill="#C6902A"/>

  <!-- tagline -->
  <text x="198" y="170"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="19" letter-spacing="5" fill="#514C40">TAKE YOUR DATA BACK</text>
</svg>
